name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute base path
        id: base
        run: |
          # User/org pages (<name>.github.io) serve from "/".
          # Project pages serve from "/<repo>/".
          # GitHub treats owner/repo names case-insensitively, so compare in lowercase.
          REPO='${{ github.event.repository.name }}'
          OWNER='${{ github.repository_owner }}'
          if [[ "${REPO,,}" == "${OWNER,,}.github.io" ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          # Point the app at your remote content repo. Set this as a repo
          # variable (Settings → Secrets and variables → Actions → Variables).
          # Falls back to the bundled sample content when unset.
          VITE_CONTENT_BASE_URL: ${{ vars.VITE_CONTENT_BASE_URL }}
        run: pnpm build

      - name: Sync 404 base path
        # Keep public/404.html's BASE in sync with the computed base path so
        # deep-link redirects work on project pages.
        run: |
          BASE='${{ steps.base.outputs.path }}'
          sed -i "s#var BASE = \".*\";#var BASE = \"${BASE}\";#" dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
